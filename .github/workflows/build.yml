name: Test and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Linux UI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb xdotool x11-utils
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Unit tests
        run: python -m unittest -v test_core.py test_native.py
      - name: Compile entry point
        run: python -m py_compile stepfwd_sidecar.py
      - name: Linux UI and X11 integration tests
        if: runner.os == 'Linux'
        env:
          TYPEPASTE_REQUIRE_GUI: '1'
          TYPEPASTE_X11_TEST: '1'
        run: xvfb-run -a python -m unittest -v test_ui.py test_x11_integration.py
      - name: Native Tk smoke tests
        if: runner.os != 'Linux'
        env:
          TYPEPASTE_REQUIRE_GUI: '1'
        run: python -m unittest -v test_ui.py
      - name: Build native package
        run: python scripts/build.py --skip-tests
      - uses: actions/upload-artifact@v4
        with:
          name: TypePaste-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
